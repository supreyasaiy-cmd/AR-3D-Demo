<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Jasmine AR Demo</title>

  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
      background: #f5f5f5;
    }

    .ar-button {
      position: absolute;
      left: 50%;
      bottom: 32px;
      transform: translateX(-50%);

      padding: 14px 24px;

      border: none;
      border-radius: 999px;

      background: #111;
      color: white;

      font-size: 16px;
      font-weight: 600;

      cursor: pointer;
    }
  </style>
</head>

<body>

  <model-viewer
    src="./Jasmine_02.glb"

    alt="Jasmine 3D Model"

    camera-controls
    auto-rotate

    shadow-intensity="1"
    exposure="1"

    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="auto">

    <button
      slot="ar-button"
      class="ar-button">
      View in AR
    </button>

  </model-viewer>

</body>

</html>
